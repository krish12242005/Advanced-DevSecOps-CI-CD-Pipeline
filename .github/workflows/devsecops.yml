name: Advanced DevSecOps CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q


  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install bandit==1.8.6

      - name: Run Bandit SAST
        run: |
          bandit -r app -c security/bandit.yaml -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json


  trivy-filesystem:
    name: Trivy Filesystem Security Scan
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: security/trivy.yaml
          format: table
          exit-code: "1"
          ignore-unfixed: true


  sonar:
    name: SonarQube Code Quality
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  docker:
    name: Docker Build and Trivy Image Scan
    runs-on: ubuntu-latest
    needs: trivy-filesystem

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t cloudnexaa-devsecops:${{ github.sha }} \
            .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloudnexaa-devsecops:${{ github.sha }}
          scan-type: image
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"


  security-summary:
    name: DevSecOps Security Gate
    runs-on: ubuntu-latest
    needs:
      - test
      - sast
      - trivy-filesystem
      - sonar
      - docker
    if: always()

    steps:
      - name: Evaluate pipeline
        run: |
          echo "========================================"
          echo " Advanced DevSecOps Security Gate"
          echo "========================================"
          echo "Unit Tests:          ${{ needs.test.result }}"
          echo "SAST:                ${{ needs.sast.result }}"
          echo "Trivy Filesystem:    ${{ needs.trivy-filesystem.result }}"
          echo "SonarQube:           ${{ needs.sonar.result }}"
          echo "Docker + Trivy:      ${{ needs.docker.result }}"
          echo "========================================"

          if [[ "${{ needs.test.result }}" != "success" ||
                "${{ needs.sast.result }}" != "success" ||
                "${{ needs.trivy-filesystem.result }}" != "success" ||
                "${{ needs.docker.result }}" != "success" ]]; then
            echo "Security gate FAILED."
            exit 1
          fi

          echo "Security gate PASSED."
